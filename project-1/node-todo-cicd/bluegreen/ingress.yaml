apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nodejs-ing
  namespace: nodejs
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: node.hicloud.co.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-svc
                port:
                  number: 80
          - path: /node
            pathType: Prefix
            backend:
              service:
                name: nodejs-svc
                port:
                  number: 8000
