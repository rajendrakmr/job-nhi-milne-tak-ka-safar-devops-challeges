kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2
metadata:
  name: nodejs-hpa 
  namespace: nodejs 
spec:
  scaleTargetRef:
    apiVersion: apps/v1 
    kind: Deployment
    name: nodejs-deploy
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource 
      resource:
        name: cpu
        target: 
         type: Utilization 
         averageUtilization: 4
