# ----------------------
# 1️⃣ Namespace
# ----------------------
apiVersion: v1
kind: Namespace
metadata:
  name: nodejs
  labels:
    istio-injection: enabled

---
# ----------------------
# 2️⃣ Stable Deployment (v1)
# ----------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stable-deploy
  namespace: nodejs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
      version: v1
  template:
    metadata:
      labels:
        app: web
        version: v1
    spec:
      containers:
      - name: stable
        image: rk0617/nodeapp-mini:v1.1.0
        ports:
        - containerPort: 8000

---
# ----------------------
# 3️⃣ Canary Deployment (v2)
# ----------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary-deploy
  namespace: nodejs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
      version: v2
  template:
    metadata:
      labels:
        app: web
        version: v2
    spec:
      containers:
      - name: canary
        image: rk0617/nodeapp-mini:v2.3.0
        ports:
        - containerPort: 8000

---
# ----------------------
# 4️⃣ Shared Service
# ----------------------
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: nodejs
spec:
  selector:
    app: web
  ports:
  - name: http
    port: 8000
    targetPort: 8000

---
# ----------------------
# 5️⃣ Cert-Manager ClusterIssuer (Let's Encrypt)
# ----------------------
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: rajendraakmr@gmail.com    
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: istio

---
# ----------------------
# 6️⃣ SSL Certificate for demo.hrcloud.in
# ----------------------
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: myapp-cert
  namespace: nodejs
spec:
  secretName: myapp-tls
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: demo.hrcloud.in
  dnsNames:
  - demo.hrcloud.in

---
# ----------------------
# 7️⃣ Istio Gateway (HTTP + HTTPS)
# ----------------------
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: myapp-gateway
  namespace: nodejs
spec:
  selector:
    istio: ingress
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "demo.hrcloud.in"
    tls:
      httpsRedirect: true   # Redirect HTTP → HTTPS
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "demo.hrcloud.in"
    tls:
      mode: SIMPLE
      credentialName: myapp-tls   # 👈 Same secret name as Certificate spec.secretName

---
# ----------------------
# 8️⃣ DestinationRule (Sticky Cookie)
# ----------------------
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: web
  namespace: nodejs
spec:
  host: web.nodejs.svc.cluster.local
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
  trafficPolicy:
    loadBalancer:
      consistentHash:
        httpCookie:
          name: canary
          ttl: 1h

---
# ----------------------
# 9️⃣ VirtualService (50-50 Canary Split)
# ----------------------
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: web
  namespace: nodejs
spec:
  hosts:
  - "demo.hrcloud.in"
  gateways:
  - myapp-gateway
  http:
  - route:
      - destination:
          host: web.nodejs.svc.cluster.local
          subset: v1
        weight: 50
      - destination:
          host: web.nodejs.svc.cluster.local
          subset: v2
        weight: 50
