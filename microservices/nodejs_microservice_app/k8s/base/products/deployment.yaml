apiVersion: apps/v1
kind: Deployment
metadata:
  name: products
  labels:
    app: products
spec:
  replicas: 2
  selector:
    matchLabels:
      app: products
  template:
    metadata:
      labels:
        app: products
    spec:
      containers:
        - name: products
          image: rk0617/products:latest
          ports:
            - containerPort: 8002
          env:
            - name: NODE_ENV
              value: "production"
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: mongo-user
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: mongo-password
          command: ["/bin/sh", "-c"]
          args:
            - |
              export MONGO_URL="mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/products?authSource=admin";
              echo "✅ Mongo URL = $MONGO_URL";
              npm start;
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
