server {
    listen 80;
    charset utf-8;

    add_header "Access-Control-Allow-Origin" "*" always;
    add_header "Access-Control-Allow-Methods" "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header "Access-Control-Allow-Headers" "Origin, Content-Type, Accept, Authorization" always;

    # ======================================================
    # ================ PRODUCTS UPLOADS ====================
    # ======================================================
    # location ^~ /products/uploads/ {
    #     proxy_pass http://products:8002;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     add_header Cache-Control "public, max-age=31536000, immutable";
    # }

    location /images/ {
      proxy_pass http://products:8002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
}


    # ======================================================
    # ================ PRODUCTS SERVICE ====================
    # ======================================================
    location ^~ /products {
        if ($request_method = OPTIONS) {
            add_header "Access-Control-Allow-Origin" "*" always;
            add_header "Access-Control-Allow-Methods" "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header "Access-Control-Allow-Headers" "Origin, Content-Type, Accept, Authorization" always;
            return 204;
        }

        rewrite ^/products/?(.*)$ /$1 break;
        proxy_pass http://products:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ======================================================
    # ================ SHOPPING SERVICE ====================
    # ======================================================
    location ^~ /shopping {
        rewrite ^/shopping/?(.*)$ /$1 break;
        proxy_pass http://shopping:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ======================================================
    # ================ CUSTOMER SERVICE ====================
    # ======================================================
    location ^~ /customer {
        rewrite ^/customer/?(.*)$ /$1 break;
        proxy_pass http://customer:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ======================================================
    # ================ DEFAULT HEALTH ROUTE ================
    # ======================================================
    location / {
        return 200 "NGINX proxy is running ✅";
        add_header Content-Type text/plain;
    }
}
